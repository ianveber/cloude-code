name: Website — build, audit & render check

on:
  push:
    branches: ['**']
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The generator itself has no dependencies; the dev dependency is
      # puppeteer-core, used only by the render check below.
      - name: Install dev dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: SEO / GEO audit
        run: npm run audit

      # Renders every page across desktop, laptop, tablet and phone widths and
      # fails if a decorative drawing lands behind copy or a page scrolls
      # sideways. ubuntu-latest ships Chrome at this path.
      - name: Render check
        run: npm run render-check
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
