<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Space — Veta</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./space.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <button class="icon-btn tree-toggle" id="treeToggle" type="button" aria-label="Toggle file tree">☰</button>
    <a class="brand" href="#note" data-view="note">
      <span class="lamps" aria-hidden="true">
        <i class="lamp claude"></i>
        <i class="lamp chatgpt"></i>
        <i class="lamp cursor"></i>
      </span>
      <span class="brand-copy">
        <span class="brand-name">Memory Space</span>
        <span class="brand-sub">ChatGPT · Claude · Cursor</span>
      </span>
    </a>

    <nav class="views" aria-label="Views">
      <button type="button" class="view-btn" data-view="note" id="viewNote">Notes</button>
      <button type="button" class="view-btn" data-view="graph" id="viewGraph">Graph</button>
      <button type="button" class="view-btn" data-view="ledger" id="viewLedger">Ledger</button>
    </nav>

    <button class="search-launch" id="searchBtn" type="button">
      Search notes
      <kbd>/</kbd>
    </button>

    <div class="filters" id="filters" role="group" aria-label="Filter by writer"></div>
  </header>

  <div class="shell" id="shell">
    <aside class="tree" id="tree" aria-label="Vault files"></aside>
    <main class="main" id="main"></main>
    <aside class="meta" id="meta" aria-label="Backlinks and source"></aside>
  </div>

  <div class="palette" id="palette" hidden>
    <div class="palette-card">
      <input id="paletteInput" type="search" placeholder="Jump to a note…" autocomplete="off" spellcheck="false">
      <ul id="paletteList"></ul>
    </div>
  </div>

  <script src="./vault-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
