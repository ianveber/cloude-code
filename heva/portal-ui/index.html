<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arhiv - Heva</title>
<style>
  :root{
    --teal:#12ADAB; --teal-deep:#0E7E77; --teal-bright:#50D8D8; --teal-tint:#E6F7F6; --teal-soft:#C7EAE8;
    --ink:#0E2A2B; --text:#33484A; --text-2:#6B8082; --text-3:#9AAEAF;
    --bg:#F4F7F7; --surface:#FFFFFF; --surface-2:#F8FBFB; --border:#E7EEEE;
    --shadow:0 1px 2px rgba(14,42,43,.05), 0 12px 40px rgba(14,42,43,.10);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
    font-size:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:1rem;line-height:1.5}
  svg{display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--teal-soft)}

  /* skip links (accessibility — real feature) */
  .skip{position:absolute;left:-999px;top:0;z-index:200;background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:0 0 10px 0;font-size:.85rem}
  .skip:focus{left:0}

  .wrap{display:grid;grid-template-columns:1.02fr 1fr;min-height:100vh}

  /* ── LEFT · brand panel ─────────────────── */
  .brand{position:relative;overflow:hidden;padding:44px 48px;color:#fff;
    background:radial-gradient(120% 120% at 15% 0%, #16C0BD 0%, var(--teal) 32%, var(--teal-deep) 100%);
    display:flex;flex-direction:column;justify-content:space-between}
  .brand::after{content:"";position:absolute;inset:0;
    background:radial-gradient(60% 55% at 85% 90%, rgba(80,216,216,.45) 0%, rgba(80,216,216,0) 60%)}
  .brand-deco{position:absolute;right:-60px;bottom:-40px;color:rgba(255,255,255,.10);pointer-events:none}
  .brand-top{position:relative;z-index:1}
  .brand-logo{height:30px;filter:brightness(0) invert(1);display:block}
  .brand-mid{position:relative;z-index:1;margin:auto 0}
  .brand-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.82);
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    padding:6px 13px;border-radius:99px;margin-bottom:20px}
  .brand-eyebrow .d{width:6px;height:6px;border-radius:50%;background:#fff}
  .brand h1{font-size:2.6rem;font-weight:750;letter-spacing:-.03em;line-height:1.05}
  .brand h1 span{color:rgba(255,255,255,.62);font-weight:600}
  .brand-links{position:relative;z-index:1;display:flex;gap:20px;font-size:.86rem;color:rgba(255,255,255,.82)}
  .brand-links a{display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .brand-links a:hover{color:#fff}

  /* ── RIGHT · form panel ─────────────────── */
  .panel{background:var(--surface);display:flex;flex-direction:column;padding:24px 28px}
  .panel-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .aaa{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:11px;padding:3px}
  .aaa button{display:flex;align-items:center;justify-content:center;width:32px;height:30px;border-radius:8px;
    color:var(--text-2);font-weight:700;transition:.13s;line-height:1}
  .aaa button:hover{background:#fff;color:var(--teal-deep)}
  .aaa button.a1{font-size:.72rem}.aaa button.a2{font-size:.85rem}.aaa button.a3{font-size:1rem}
  .lang{position:relative;display:flex;align-items:center}
  .lang .globe{position:absolute;left:12px;color:var(--text-2);pointer-events:none}
  .lang .chev{position:absolute;right:11px;color:var(--text-3);pointer-events:none}
  .lang select{appearance:none;-webkit-appearance:none;height:40px;border:1px solid var(--border);
    background:var(--surface-2);border-radius:11px;padding:0 34px 0 36px;font-size:.9rem;font-family:inherit;
    color:var(--ink);font-weight:550;cursor:pointer}
  .lang select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}

  .panel-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 0}
  .card{width:100%;max-width:388px}
  .card .kicker{font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-deep);margin-bottom:10px}
  .card h2{font-size:1.75rem;font-weight:750;color:var(--ink);letter-spacing:-.025em;margin-bottom:24px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.82rem;font-weight:600;color:var(--text-2);margin-bottom:7px;padding-left:2px}
  .iw{position:relative;display:flex;align-items:center}
  .iw .ic{position:absolute;left:14px;color:var(--text-3)}
  .field input{width:100%;height:52px;border:1px solid var(--border);background:var(--surface-2);
    border-radius:13px;padding:0 14px 0 44px;font-size:1rem;color:var(--ink);transition:.15s;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3.5px var(--teal-tint)}
  .field input::placeholder{color:var(--text-3)}
  .btn{width:100%;height:52px;background:var(--teal);color:#fff;border-radius:13px;
    font-size:1rem;font-weight:650;display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 6px 18px rgba(18,173,171,.32);transition:.15s;margin-top:6px}
  .btn:hover{background:#0FA09E;box-shadow:0 8px 22px rgba(18,173,171,.42)}
  .btn:active{transform:translateY(1px)}

  .help{margin-top:26px;padding-top:20px;border-top:1px solid var(--border);text-align:center}
  .help .ht{font-size:.8rem;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .help a{display:inline-flex;align-items:center;gap:7px;font-size:.92rem;font-weight:600;color:var(--teal-deep);
    background:var(--teal-tint);border:1px solid var(--teal-soft);padding:8px 15px;border-radius:11px;transition:.13s}
  .help a:hover{background:#DCF2F1}

  .panel-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:.78rem;color:var(--text-3);padding-top:14px;border-top:1px solid var(--border)}
  .panel-foot a{color:var(--text-2);font-weight:550}
  .panel-foot a:hover{color:var(--teal-deep)}

  @media(max-width:820px){
    .wrap{grid-template-columns:1fr}
    .brand{min-height:210px;padding:26px 24px}
    .brand h1{font-size:2rem}
    .brand-mid{margin:14px 0}
    .panel{padding:20px 18px}
  }
</style>
</head>
<body>
<a class="skip" href="#menu">Pojdi na izbiro</a>
<a class="skip" href="#content">Pojdi na vsebino</a>

<div class="wrap">
  <!-- LEFT · brand -->
  <section class="brand">
    <svg class="brand-deco" width="360" height="360" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 21V5.5a1.5 1.5 0 0 1 1-1.42l7-2.4a1 1 0 0 1 1.3.95V21"/><path d="M13.3 8.8 19 10.7a1.5 1.5 0 0 1 1 1.42V21"/><path d="M2.5 21h19"/><path d="M7.5 8h2M7.5 12h2M7.5 16h2"/>
    </svg>
    <div class="brand-top">
      <a href="index.html"><img class="brand-logo" src="assets/logo-nav.png" alt="Arhiv - Heva"></a>
    </div>
    <div class="brand-mid">
      <span class="brand-eyebrow"><span class="d"></span>Domača stran portala</span>
      <h1>Arhiv <span>— Heva</span></h1>
    </div>
    <nav class="brand-links" id="menu">
      <a href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>Arhiv</a>
    </nav>
  </section>

  <!-- RIGHT · form -->
  <main class="panel" id="content">
    <div class="panel-top">
      <div class="aaa" role="group" aria-label="Velikost besedila">
        <button class="a1" title="Zmanjšaj besedilo" aria-label="Zmanjšaj besedilo" onclick="setFont(-1)">A</button>
        <button class="a2" title="Ponastavi velikost besedila" aria-label="Ponastavi velikost besedila" onclick="setFont(0)">A</button>
        <button class="a3" title="Povečaj besedilo" aria-label="Povečaj besedilo" onclick="setFont(1)">A</button>
      </div>
      <div class="lang">
        <span class="globe"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17"/><path d="M12 3c2.4 2.5 3.7 5.6 3.7 9S14.4 18.5 12 21c-2.4-2.5-3.7-5.6-3.7-9S9.6 5.5 12 3Z"/></svg></span>
        <select aria-label="Jezik">
          <option value="sl" selected>Slovenščina</option>
          <option value="en">English</option>
        </select>
        <span class="chev"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 9 5 5 5-5"/></svg></span>
      </div>
    </div>

    <div class="panel-mid">
      <form class="card" onsubmit="return false">
        <div class="kicker">Arhiv - Heva</div>
        <h2>Prijava</h2>

        <div class="field">
          <label for="user">E-poštni naslov</label>
          <div class="iw">
            <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span>
            <input id="user" type="email" autocomplete="username" autocapitalize="none" spellcheck="false">
          </div>
        </div>
        <div class="field">
          <label for="pass">Geslo</label>
          <div class="iw">
            <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></span>
            <input id="pass" type="password" autocomplete="current-password">
          </div>
        </div>
        <div id="loginErr" style="display:none;font-size:.85rem;font-weight:600;color:#B3261E;
             background:#FDECEA;border:1px solid #F5C6C2;border-radius:11px;padding:9px 13px;margin-bottom:12px"></div>
        <button class="btn" type="submit" id="loginBtn">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h10"/><path d="m16.5 8.5 3.5 3.5-3.5 3.5"/><path d="M12 4.5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h6"/></svg>
          Prijava
        </button>

        <div class="help">
          <div class="ht">Pomoč</div>
          <a href="mailto:info@heva.si">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z"/></svg>info@heva.si</a>
        </div>
      </form>
    </div>

    <footer class="panel-foot">
      <span>Podpora: <a href="mailto:info@heva.si">info@heva.si</a></span>
      <span>Arhiv Heva © 2026</span>
    </footer>
  </main>
</div>

<script src="vendor/supabase.js"></script>
<script src="ui.js"></script>
<script src="live.js"></script>
<script>
  // A A A — text size (real accessibility feature)
  let step = 0;
  function setFont(dir){
    step = dir === 0 ? 0 : Math.max(-1, Math.min(2, step + dir));
    document.documentElement.style.fontSize = (16 + step*1.5) + 'px';
  }

  const form = document.querySelector('form.card');
  const btn  = document.getElementById('loginBtn');
  const err  = document.getElementById('loginErr');

  // Already signed in? Skip the form.
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) location.replace('objekti.html');
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.style.display = 'none';
    const email = document.getElementById('user').value.trim();
    const password = document.getElementById('pass').value;
    if (!email || !password) {
      err.textContent = 'Vnesite e-poštni naslov in geslo.';
      err.style.display = 'block';
      return;
    }
    btn.disabled = true;
    const label = btn.innerHTML;
    btn.innerHTML = 'Prijavljanje…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      err.textContent = error.message === 'Invalid login credentials'
        ? 'Napačen e-poštni naslov ali geslo.'
        : error.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = label;
      return;
    }
    location.replace('objekti.html');
  });
</script>
</body>
</html>
