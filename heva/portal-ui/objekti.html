<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arhiv - Heva — Moji objekti</title>
<style>
  :root{
    --bg:#F4F7F7; --surface:#FFFFFF; --surface-2:#F8FBFB;
    --teal:#12ADAB; --teal-deep:#0E7E77; --teal-tint:#E6F7F6; --teal-tint-2:#F1FAFA; --teal-soft:#C7EAE8;
    --ink:#0E2A2B; --text:#33484A; --text-2:#6B8082; --text-3:#9AAEAF;
    --border:#E7EEEE; --border-2:#EFF4F4;
    --amber:#E8A33D; --amber-tint:#FCF3E4;
    --shadow-sm:0 1px 2px rgba(14,42,43,.04), 0 1px 3px rgba(14,42,43,.05);
    --shadow:0 1px 2px rgba(14,42,43,.04), 0 8px 24px rgba(14,42,43,.06);
    --r:16px; --r-sm:12px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  svg{display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--teal-soft)}

  .layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}

  /* ── Sidebar ─────────────────────────────── */
  .side{background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side-logo{height:25px;margin:6px 8px 20px;width:auto}
  .nav-group{margin-bottom:16px}
  .nav-label{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;padding:0 10px;margin-bottom:6px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:10px;
    font-size:13.5px;font-weight:550;color:var(--text);transition:.12s}
  .nav a .nic{color:var(--text-3);flex:none;transition:.12s}
  .nav a:hover{background:var(--surface-2)}
  .nav a.active{background:var(--teal-tint);color:var(--teal-deep);font-weight:650}
  .nav a.active .nic{color:var(--teal-deep)}
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);
    font-size:11px;color:var(--text-3);padding-left:10px;line-height:1.6}
  .side-foot a{color:var(--text-2)}

  /* ── Main ────────────────────────────────── */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:64px;background:rgba(244,247,247,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 26px;position:sticky;top:0;z-index:20}
  .tnav{display:flex;align-items:center;gap:3px}
  .tnav a{font-size:13.5px;font-weight:600;color:var(--text-2);padding:8px 13px;border-radius:10px;transition:.12s}
  .tnav a:hover{background:var(--surface);color:var(--ink)}
  .tnav a.active{background:var(--teal-tint);color:var(--teal-deep)}
  .search{margin-left:12px;flex:1;max-width:280px;position:relative;display:flex;align-items:center}
  .search .ic{position:absolute;left:12px;color:var(--text-3)}
  .search input{width:100%;height:38px;border:1px solid var(--border);background:var(--surface);
    border-radius:10px;padding:0 12px 0 38px;font-size:13.5px;color:var(--ink);font-family:inherit}
  .search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .aaa{display:flex;align-items:center;gap:1px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2px}
  .aaa button{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;color:var(--text-2);font-weight:700;line-height:1;transition:.12s}
  .aaa button:hover{background:var(--surface-2);color:var(--teal-deep)}
  .aaa .a1{font-size:11px}.aaa .a2{font-size:13px}.aaa .a3{font-size:15px}
  .user{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:11px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-deep) 100%);
    color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .user .uname{font-size:13px;font-weight:600;color:var(--ink);line-height:1.15}
  .user .ulogout{font-size:11.5px;color:var(--text-3)}
  .user .ulogout:hover{color:var(--teal-deep)}

  .content{padding:26px 30px 40px;max-width:1240px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .page-head h1{font-size:25px;font-weight:750;color:var(--ink);letter-spacing:-.025em}
  .page-head .cnt{font-size:14px;color:var(--text-2);margin-top:3px}
  .filter{position:relative;display:flex;align-items:center;min-width:230px}
  .filter .ic{position:absolute;left:13px;color:var(--text-3)}
  .filter input{width:100%;height:42px;border:1px solid var(--border);background:var(--surface);
    border-radius:12px;padding:0 12px 0 40px;font-size:14px;color:var(--ink);font-family:inherit}
  .filter input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:15px}
  .obj{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:16px;box-shadow:var(--shadow-sm);transition:.14s;display:flex;flex-direction:column;gap:13px}
  .obj:hover{border-color:var(--teal-soft);box-shadow:var(--shadow);transform:translateY(-1px)}
  .obj-top{display:flex;align-items:center;gap:12px}
  .obj-ic{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--teal-tint);color:var(--teal-deep)}
  .obj-name{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em;line-height:1.2;min-width:0}
  .obj-upd{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);margin-top:3px}
  .obj-upd .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
  .obj-actions{display:flex;gap:8px;margin-top:auto}
  .obj-actions .b-doc{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:38px;
    background:var(--teal-tint);color:var(--teal-deep);border:1px solid var(--teal-soft);border-radius:10px;font-size:13px;font-weight:650;transition:.12s}
  .obj-actions .b-doc:hover{background:var(--teal);border-color:var(--teal);color:#fff}
  .obj-actions .b-edit{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);border-radius:10px;color:var(--text-2);background:var(--surface-2);transition:.12s}
  .obj-actions .b-edit:hover{border-color:var(--teal-soft);color:var(--teal-deep)}
  .obj.hidden{display:none}
  .nomatch{display:none;color:var(--text-2);font-size:14px;padding:30px 4px}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr}
    .side{display:none}
    .tnav{display:none}
    .search{margin-left:0}
    .content{padding:20px 16px 40px}
  }
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="side">
    <a href="objekti.html"><img class="side-logo" src="assets/logo-nav.png" alt="Arhiv - Heva"></a>

    <div class="nav-group">
      <div class="nav-label">Objekti</div>
      <nav class="nav" id="nav-objekti">
        <a data-view="vsi" class="active"><span class="nic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></svg></span>Vsi objekti</a>
        <a data-view="nedavno"><span class="nic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>Nedavno posodobljeno</a>
      </nav>
    </div>

    <div class="nav-group">
      <div class="nav-label">Skrbništvo</div>
      <nav class="nav" id="nav-admin">
        <a data-view="uporabniki"><span class="nic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2.5 19a4.5 4.5 0 0 1 9 0M12.5 19a4.5 4.5 0 0 1 9 0"/></svg></span>Uporabniki in dostopi</a>
        <a data-view="dnevnik"><span class="nic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><rect x="7" y="11" width="3.2" height="6" rx="1"/><rect x="13.8" y="7" width="3.2" height="10" rx="1"/></svg></span>Dnevnik dostopov</a>
        <a data-view="profil"><span class="nic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>Moj profil</a>
      </nav>
    </div>

    <div class="side-foot">
      Podpora: <a href="mailto:info@heva.si">info@heva.si</a><br>
      Arhiv Heva © 2026
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <nav class="tnav" id="tnav">
        <a data-view="vsi" class="active">Moji objekti</a>
        <a data-view="uporabniki">Uporabniki</a>
        <a data-view="dnevnik">Dnevnik dostopov</a>
      </nav>
      <div class="search">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></span>
        <input id="topsearch" type="text" placeholder="Išči uporabnike">
      </div>
      <div class="top-actions">
        <div class="aaa" role="group" aria-label="Velikost besedila">
          <button class="a1" title="Zmanjšaj besedilo" onclick="setFont(-1)">A</button>
          <button class="a2" title="Ponastavi velikost besedila" onclick="setFont(0)">A</button>
          <button class="a3" title="Povečaj besedilo" onclick="setFont(1)">A</button>
        </div>
        <div class="user">
          <div class="avatar" id="avatar" title="Moj profil"></div>
          <div>
            <div class="uname" id="uname"></div>
            <a class="ulogout" href="#" onclick="event.preventDefault();signOut()">Odjava</a>
          </div>
        </div>
      </div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<script src="vendor/supabase.js"></script>
<script src="ui.js"></script>
<script src="live.js"></script>
<script>
(async () => {
  const HEVA = await loadHeva();
  if (!HEVA) return;                       // no session -> redirected
  initFontScale(15);
  document.getElementById('uname').textContent  = HEVA.user.name;
  document.getElementById('avatar').textContent = HEVA.user.initials;
  document.getElementById('avatar').onclick     = () => show('profil');

  const ICON = {
    bld:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5.5a1.5 1.5 0 0 1 1-1.42l7-2.4a1 1 0 0 1 1.3.95V21"/><path d="M13.3 8.8 19 10.7a1.5 1.5 0 0 1 1 1.42V21"/><path d="M2.5 21h19"/><path d="M7.5 8h2M7.5 12h2M7.5 16h2"/></svg>',
    doc:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/></svg>',
    edit: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    srch: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>'
  };

  const plural = n => n + (n === 1 ? ' objekt' : n === 2 ? ' objekta' : n < 5 && n > 0 ? ' objekti' : ' objektov');
  const totalMb = o => o.folders.reduce((a, f) => a + f.mb, 0);
  const fileCount = o => o.folders.reduce((a, f) => a + f.files.length, 0);

  let view = 'vsi', q = '';

  function setActive(v) {
    document.querySelectorAll('#nav-objekti a,#nav-admin a,#tnav a').forEach(a =>
      a.classList.toggle('active', a.dataset.view === v));
  }

  function show(v) { view = v; q = ''; setActive(v); render(); }

  document.querySelectorAll('#nav-objekti a,#nav-admin a,#tnav a')
    .forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.view); });

  document.getElementById('topsearch').addEventListener('input', e => {
    q = e.target.value.trim().toLowerCase();
    if (view !== 'uporabniki') { view = 'uporabniki'; setActive('uporabniki'); }
    render();
  });

  /* ── Views ─────────────────────────────────────────────────────── */

  function objectsView(onlyRecent) {
    const list = HEVA.objekti
      .filter(o => !onlyRecent || o.updated)
      .filter(o => !q || o.name.toLowerCase().includes(q));

    return `
      <div class="page-head">
        <div>
          <h1>${onlyRecent ? 'Nedavno posodobljeno' : 'Moji objekti'}</h1>
          <div class="cnt" id="count">${plural(list.length)}</div>
        </div>
        <div class="filter">
          <span class="ic">${ICON.srch}</span>
          <input id="q" type="text" placeholder="Poišči objekt…" value="${q.replace(/"/g,'&quot;')}">
        </div>
      </div>
      <div class="grid">
        ${list.map(o => `
          <div class="obj" data-slug="${o.slug}">
            <div class="obj-top">
              <div class="obj-ic">${ICON.bld}<img class="photo" src="assets/objekti/${o.slug}.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
              <div style="min-width:0">
                <div class="obj-name">${o.name}</div>
                ${o.updated ? `<div class="obj-upd"><span class="dot"></span>Posodobljeno ${o.updated}</div>`
                            : `<div class="obj-upd" style="color:var(--text-3)">${fileCount(o)} dokumentov</div>`}
              </div>
            </div>
            <div class="obj-actions">
              <a class="b-doc" data-go="${o.slug}">${ICON.doc} Dokumenti</a>
              <a class="b-edit" data-info="${o.slug}" title="Podrobnosti">${ICON.edit}</a>
            </div>
          </div>`).join('')}
      </div>
      ${list.length ? '' : '<div class="empty">Ni zadetkov.</div>'}`;
  }

  function usersView() {
    const list = HEVA.uporabniki.filter(u =>
      !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
    return `
      <div class="page-head">
        <div><h1>Uporabniki in dostopi</h1>
          <div class="cnt">${list.length} uporabnikov · dostop je vezan na objekt</div></div>
        <div class="filter">
          <span class="ic">${ICON.srch}</span>
          <input id="q" type="text" placeholder="Poišči uporabnika…" value="${q.replace(/"/g,'&quot;')}">
        </div>
      </div>
      <div class="dtable">
        <div class="dhead" style="grid-template-columns:1.4fr 1.6fr 130px 1fr">
          <span>Ime</span><span>E-pošta</span><span>Vloga</span><span>Dostop do</span>
        </div>
        ${list.map(u => `
          <div class="drow" style="grid-template-columns:1.4fr 1.6fr 130px 1fr" data-user="${u.email}">
            <span class="strong">${u.name}</span>
            <span class="muted">${u.email}</span>
            <span><span class="pill ${u.role === 'manager' ? 'mgr' : 'res'}">${u.role === 'manager' ? 'Upravitelj' : 'Stanovalec'}</span></span>
            <span>${u.objekti}</span>
          </div>`).join('')}
        ${list.length ? '' : '<div class="empty">Ni zadetkov.</div>'}
      </div>
`;
  }

  function logView() {
    return `
      <div class="page-head">
        <div><h1>Dnevnik dostopov</h1>
          <div class="cnt">Vsak ogled in prenos se zabeleži — dokazilo o vročitvi (GDPR)</div></div>
      </div>
      <div class="dtable">
        <div class="dhead" style="grid-template-columns:1.1fr 1.7fr 1.1fr 110px 150px">
          <span>Uporabnik</span><span>Dokument</span><span>Objekt</span><span>Dejanje</span><span>Čas</span>
        </div>
        ${HEVA.dnevnik.map(d => `
          <div class="drow" style="grid-template-columns:1.1fr 1.7fr 1.1fr 110px 150px">
            <span class="strong">${d.who}</span>
            <span class="muted">${d.what}</span>
            <span>${d.obj}</span>
            <span><span class="pill ${d.act === 'prenos' ? 'dl-act' : 'vw-act'}">${d.act}</span></span>
            <span class="muted">${d.when}</span>
          </div>`).join('')}
      </div>
`;
  }

  function profileView() {
    const u = HEVA.user;
    return `
      <div class="page-head"><div><h1>Moj profil</h1></div></div>
      <div class="dtable" style="max-width:560px">
        <div class="drow" style="grid-template-columns:150px 1fr"><span class="muted">Ime</span><span class="strong">${u.name}</span></div>
        <div class="drow" style="grid-template-columns:150px 1fr"><span class="muted">E-pošta</span><span class="strong">${u.email}</span></div>
        <div class="drow" style="grid-template-columns:150px 1fr"><span class="muted">Vloga</span><span><span class="pill mgr">${u.role}</span></span></div>
        <div class="drow" style="grid-template-columns:150px 1fr"><span class="muted">Dostop</span><span class="strong">vsi objekti (${HEVA.objekti.length})</span></div>
        <div class="drow" style="grid-template-columns:150px 1fr"><span class="muted">Prijava</span><span class="strong">povezava na e-pošto (brez gesla)</span></div>
      </div>`;
  }

  /* ── Render + wiring ───────────────────────────────────────────── */
  function render() {
    const el = document.getElementById('content');
    el.innerHTML =
      view === 'vsi'        ? objectsView(false) :
      view === 'nedavno'    ? objectsView(true)  :
      view === 'uporabniki' ? usersView()        :
      view === 'dnevnik'    ? logView()          : profileView();

    const qi = document.getElementById('q');
    if (qi) {
      qi.oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
      if (q) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
    }

    el.querySelectorAll('.obj').forEach(card => {
      card.onclick = e => {
        const info = e.target.closest('[data-info]');
        if (info) { e.stopPropagation(); showInfo(info.dataset.info); return; }
        location.href = 'dokumenti.html?o=' + card.dataset.slug;
      };
    });

    el.querySelectorAll('[data-user]').forEach(r => r.onclick = () => {
      const u = HEVA.uporabniki.find(x => x.email === r.dataset.user);
      modal(u.name, `<dl class="dl">
          <dt>E-pošta</dt><dd>${u.email}</dd>
          <dt>Vloga</dt><dd>${u.role === 'manager' ? 'Upravitelj' : 'Stanovalec'}</dd>
          <dt>Dostop do</dt><dd>${u.objekti}</dd>
        </dl>
        <p style="margin-top:14px;color:var(--text-2);font-size:13px">
          Dostop je vezan na objekt. Stanovalec ne vidi dokumentov drugih objektov —
          to preprečuje baza, ne vmesnik.</p>`);
    });
  }

  function showInfo(slug) {
    const o = HEVA.bySlug(slug);
    modal(o.name, `<dl class="dl">
        <dt>Vrsta</dt><dd>${o.kind === 'commercial' ? 'Poslovni objekt' : 'Večstanovanjska stavba'}</dd>
        <dt>Map</dt><dd>${o.folders.length}</dd>
        <dt>Dokumentov</dt><dd>${fileCount(o)}</dd>
        <dt>Skupaj</dt><dd>${fmtSize(totalMb(o))}</dd>
        <dt>Posodobljeno</dt><dd>${o.updated || '—'}</dd>
      </dl>`,
      [{ label: 'Zapri' }, { label: 'Odpri dokumente', primary: true,
         onClick: () => location.href = 'dokumenti.html?o=' + o.slug }]);
  }

  // Deep link from the documents page: objekti.html?v=uporabniki
  if (!HEVA.user.isManager) {
    document.querySelectorAll('[data-view="uporabniki"],[data-view="dnevnik"]')
      .forEach(a => a.remove());
    const grp = document.querySelector('#nav-admin')?.closest('.nav-group');
    if (grp && !grp.querySelector('.nav a')) grp.remove();
    document.querySelector('.search')?.remove();
  }

  const wanted = new URLSearchParams(location.search).get('v');
  // Managers get every view; residents only the ones they have chrome for.
  // Without this, ?v=uporabniki would render the manager screen shell to a
  // resident — empty, because RLS returns nothing, but it shouldn't appear.
  const allowed = HEVA.user.isManager
    ? ['vsi','nedavno','uporabniki','dnevnik','profil']
    : ['vsi','nedavno','profil'];
  if (wanted && allowed.includes(wanted)) { view = wanted; setActive(wanted); }

  render();
})();
</script>
</body>
</html>
